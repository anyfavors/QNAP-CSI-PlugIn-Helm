kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: pvc-block-basic
  annotations:
    # thin allocate is customized
    trident.qnap.io/Threshold: "77"
    trident.qnap.io/ThinAllocate: "true" 

    # QuTS-hero features
    # trident.qnap.io/Deduplication: "true"
    # trident.qnap.io/Compression: "true"
    # trident.qnap.io/FastClone: "true"

    # I/O synchronization mode: default, sync, or async
    # "async" is not supported on QTS 6.0 or later and will fail volume creation.
    # trident.qnap.io/IoSyncMode: "default"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: basic
